<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>DevDock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="M7 9h5M7 13h8M7 17h4" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-name">DevDock</span>
      </div>

      <div class="active-pill" id="active-pill" hidden>
        <span class="pulse"></span>
        <span class="active-label">当前环境</span>
        <strong id="active-name">—</strong>
      </div>

      <div class="titlebar-actions">
        <button class="btn btn-primary btn-sm" id="btn-new">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3v10M3 8h10" stroke-linecap="round" />
          </svg>
          新建项目
        </button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">项目档案</span>
          <span class="count" id="project-count">0</span>
        </div>
        <div class="project-list" id="project-list"></div>
        <div class="sidebar-foot">
          <button class="link-btn" id="btn-open-logs">打开日志目录</button>
          <span class="version" id="app-version"></span>
        </div>
      </aside>

      <main class="main">
        <section class="empty" id="empty-state">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="14" y="26" width="92" height="68" rx="10" opacity="0.35" />
              <rect x="26" y="38" width="68" height="44" rx="6" opacity="0.6" />
              <path d="M46 52l-9 8 9 8M68 52l9 8-9 8M58 48l-4 24" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <h2>还没有项目</h2>
          <p>录入本地项目路径和命令，DevDock 会记住这套环境，下次一键启动。</p>
          <button class="btn btn-primary" id="btn-new-empty">新建第一个项目</button>
        </section>

        <section class="detail" id="detail" hidden>
          <header class="detail-head">
            <div class="detail-title-row">
              <span class="status-dot" id="status-dot"></span>
              <h1 id="project-name">—</h1>
              <span class="badge" id="runtime-badge" hidden></span>
              <span class="badge badge-live" id="live-badge" hidden>运行中</span>
            </div>
            <div class="path-row">
              <code id="project-path">—</code>
              <button class="link-btn" id="btn-open-dir">在资源管理器中打开</button>
            </div>
            <div class="actions">
              <button class="btn btn-ghost" id="btn-activate" hidden>设为当前环境</button>
              <button class="btn btn-ghost" id="btn-setup">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M8 2v3M8 11v3M2 8h3M11 8h3M3.8 3.8l2 2M10.2 10.2l2 2M12.2 3.8l-2 2M5.8 10.2l-2 2" stroke-linecap="round" />
                </svg>
                搭环境
              </button>
              <button class="btn btn-primary" id="btn-start">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
                  <path d="M4 2.8v10.4c0 .6.7 1 1.2.7l8-5.2a.8.8 0 0 0 0-1.4l-8-5.2A.8.8 0 0 0 4 2.8Z" />
                </svg>
                启动
              </button>
              <button class="btn btn-danger" id="btn-stop" hidden>停止</button>
              <div class="spacer"></div>
              <button class="btn btn-ghost btn-icon" id="btn-edit" title="编辑">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M11.2 2.3l2.5 2.5L5.4 13H3v-2.4l8.2-8.3Z" stroke-linejoin="round" />
                </svg>
              </button>
              <button class="btn btn-ghost btn-icon" id="btn-delete" title="删除">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2c0 .4.4.8.8.8h4.2c.4 0 .8-.4.8-.8l.6-8.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </header>

          <nav class="tabs">
            <button class="tab active" data-tab="config">配置</button>
            <button class="tab" data-tab="logs">运行日志</button>
            <span class="tab-spacer"></span>
            <div class="log-tools" id="log-tools" hidden>
              <label class="switch-label">
                <input type="checkbox" id="auto-scroll" checked />
                <span>自动滚动</span>
              </label>
              <button class="link-btn" id="btn-clear-log">清空</button>
              <button class="link-btn" id="btn-open-log">打开日志文件</button>
            </div>
          </nav>

          <div class="panel" id="panel-config">
            <div class="cards">
              <article class="card">
                <h3>运行环境</h3>
                <dl class="kv">
                  <div><dt>类型</dt><dd id="cfg-runtime">—</dd></div>
                  <div><dt>Shell</dt><dd id="cfg-shell">—</dd></div>
                  <div><dt>环境状态</dt><dd id="cfg-setup">—</dd></div>
                  <div><dt>上次使用</dt><dd id="cfg-last-used">—</dd></div>
                </dl>
              </article>

              <article class="card">
                <h3>命令</h3>
                <div class="cmd-block">
                  <span class="cmd-label">安装</span>
                  <code id="cfg-setup-cmd">—</code>
                </div>
                <div class="cmd-block">
                  <span class="cmd-label">启动</span>
                  <code id="cfg-start-cmd">—</code>
                </div>
                <div class="cmd-block">
                  <span class="cmd-label">停止前</span>
                  <code id="cfg-stop-cmd">—</code>
                </div>
              </article>

              <article class="card">
                <h3>环境变量</h3>
                <div class="env-chips" id="cfg-env-vars"></div>
                <p class="hint" id="cfg-env-hint" hidden></p>
              </article>

              <article class="card card-notes">
                <h3>检测备注</h3>
                <ul class="notes" id="cfg-notes"></ul>
              </article>
            </div>
          </div>

          <div class="panel" id="panel-logs" hidden>
            <pre class="terminal" id="log-output"></pre>
          </div>
        </section>
      </main>
    </div>

    <dialog class="editor" id="editor">
      <form method="dialog" id="editor-form" novalidate>
        <header class="editor-head">
          <h2 id="editor-title">新建项目</h2>
          <button type="button" class="btn btn-ghost btn-icon" id="editor-close" aria-label="关闭">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="editor-body">
          <div class="field">
            <label for="f-name">项目名称</label>
            <input id="f-name" type="text" placeholder="留空则使用目录名" autocomplete="off" />
          </div>

          <div class="field">
            <label for="f-dir">项目路径 <span class="req">*</span></label>
            <div class="input-row">
              <input id="f-dir" type="text" placeholder="D:\code\my-project" autocomplete="off" spellcheck="false" />
              <button type="button" class="btn btn-ghost" id="btn-browse">浏览…</button>
            </div>
            <p class="field-error" id="dir-error" hidden></p>
            <div class="detect-row">
              <button type="button" class="btn btn-ghost btn-sm" id="btn-detect">自动检测命令</button>
              <span class="detect-hint" id="detect-hint"></span>
            </div>
          </div>

          <div class="field">
            <label for="f-shell">执行 Shell</label>
            <select id="f-shell">
              <option value="cmd">CMD（推荐）</option>
              <option value="powershell">PowerShell</option>
            </select>
          </div>

          <div class="field">
            <label for="f-setup">安装 / 搭环境命令</label>
            <input id="f-setup" type="text" placeholder="npm install" autocomplete="off" spellcheck="false" />
          </div>

          <div class="field">
            <label for="f-start">启动命令</label>
            <input id="f-start" type="text" placeholder="npm run dev" autocomplete="off" spellcheck="false" />
          </div>

          <div class="field">
            <label for="f-stop">停止前命令 <span class="optional">可选</span></label>
            <input id="f-stop" type="text" placeholder="例如 docker compose down" autocomplete="off" spellcheck="false" />
          </div>

          <div class="field">
            <label>环境变量</label>
            <div class="env-editor" id="env-editor"></div>
            <button type="button" class="link-btn" id="btn-add-env">+ 添加变量</button>
          </div>

          <div class="field switches">
            <label class="check">
              <input type="checkbox" id="f-auto-setup" checked />
              <span>首次启动前自动搭环境</span>
            </label>
            <label class="check">
              <input type="checkbox" id="f-sync-env" />
              <span>把环境变量同步写入项目 <code>.env</code>（停止时自动还原）</span>
            </label>
          </div>
        </div>

        <footer class="editor-foot">
          <button type="button" class="btn btn-ghost danger-text" id="btn-editor-delete" hidden>删除项目</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
        </footer>
      </form>
    </dialog>

    <div class="toasts" id="toasts"></div>
    <script src="app.js"></script>
  </body>
</html>
